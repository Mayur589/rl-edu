version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rltutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rltutor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rltutor"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rltutor_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rltutor-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/rltutor
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=production-secret-key-change-this-for-safety-min-32-chars
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rltutor_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rltutor-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rltutor_net

volumes:
  postgres_data:

networks:
  rltutor_net:
    driver: bridge
